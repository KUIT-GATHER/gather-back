name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    # 스텝 레벨 env는 이전 스텝에서 시작된 Gradle 데몬에 전달되지 않으므로 job 레벨에 선언한다
    env:
      GATHER_DB_URL: jdbc:mysql://127.0.0.1:3306/gather?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      GATHER_DB_USERNAME: root
      GATHER_DB_PASSWORD: ci-password
      # CI의 MySQL은 빈 DB이므로 테스트 설정(validate) 대신 엔티티 기준으로 스키마를 생성한다
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gather
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Check code format (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build
