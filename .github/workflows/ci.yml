name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    # application-local.yml은 gitignore 대상이라 CI에는 존재하지 않으므로,
    # 파일 없이도 바인딩되는 Spring Boot 표준 환경변수(SPRING_DATASOURCE_*)로 DB를 직접 지정한다
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/gather?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gather
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deploy environment validator
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/validate-deploy-env.sh
          bash -n scripts/test/validate-deploy-env-test.sh
          bash scripts/test/validate-deploy-env-test.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Check code format (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build
