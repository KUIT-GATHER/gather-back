name: Deploy Gather Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # application-local.yml은 gitignore 대상이라 CI에는 존재하지 않으므로,
    # 파일 없이도 바인딩되는 Spring Boot 표준 환경변수(SPRING_DATASOURCE_*)로 DB를 직접 지정한다
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/gather?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gather
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Build Spring Boot jar
        run: ./gradlew bootJar

      - name: Prepare deploy artifact
        run: |
          mkdir -p deploy
          BOOT_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$BOOT_JAR"
          cp "$BOOT_JAR" deploy/gather.jar.new

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/gather-backend-key.pem
          chmod 600 ~/.ssh/gather-backend-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar and deploy script to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/gather-backend-key.pem deploy/gather.jar.new "$EC2_USER@$EC2_HOST:/opt/gather/gather.jar.new"
          scp -i ~/.ssh/gather-backend-key.pem scripts/deploy.sh "$EC2_USER@$EC2_HOST:/opt/gather/deploy.sh"
          scp -i ~/.ssh/gather-backend-key.pem scripts/validate-deploy-env.sh "$EC2_USER@$EC2_HOST:/opt/gather/validate-deploy-env.sh"

      - name: Run deploy script on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/gather-backend-key.pem "$EC2_USER@$EC2_HOST" "chmod +x /opt/gather/deploy.sh && /opt/gather/deploy.sh"

      # deploy.sh는 실패 시 이전 jar로 롤백해 health check가 통과하므로, 알림이 없으면
      # 배포 실패가 서비스 증상 없이 묻힌다(2026-08-14 Flyway 순서 문제 배포 실패가 하루 넘게 방치됨).
      # 커밋 메시지는 ${{ }} 직접 삽입 대신 env로 넘겨 셸 주입과 JSON 깨짐을 막는다.
      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          TEXT="🚨 **배포 실패** — ${COMMIT_MSG%%$'\n'*}
          ${RUN_URL}"
          jq -n --arg c "$TEXT" '{content: $c}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Notify Discord on success
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          TEXT="✅ 배포 완료 — ${COMMIT_MSG%%$'\n'*}
          ${RUN_URL}"
          jq -n --arg c "$TEXT" '{content: $c}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
