# ⚠ 테스트 전용 설정.
# 클래스패스 우선순위 상 이 파일이 src/main/resources/application.yml을 가린다(test 리소스 우선).
# 따라서 테스트 실행에 필요한 메인 설정(프로파일/외부 API URL 등)을 여기서 다시 선언하고,
# 테스트용 더미 jwt.secret을 추가한다. 메인 application.yml을 바꾸면 이 파일도 함께 확인할 것.
# application-secret.yml은 의도적으로 import하지 않는다 — 테스트는 개발자 개인 시크릿과
# 무관하게 항상 같은 설정(더미 jwt, 이메일 log 모드)으로 돌아야 한다.
spring:
  application:
    name: gather
  profiles:
    active: local           # application-local.yml(DB 접속 정보)이 로드되도록 유지
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

volunteer-api:
  base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService


notification:
  volunteer-schedule:
    scheduler-enabled: false
    cron: "0 0 9 * * *"
  bookmarked-posting-deadline:
    scheduler-enabled: false
    cron: "0 10 9 * * *"

  bookmarked-meeting-deadline:
    scheduler-enabled: false
    cron: "0 20 9 * * *"


gather:
  recruit:
    auto-confirm:
      scheduler-enabled: false
  aws:
    s3:
      region: ap-northeast-2
      bucket: test-profile-images
      public-base-url: https://test-profile-images.s3.ap-northeast-2.amazonaws.com
      presigned-url-expiration-seconds: 300
      api-call-timeout-seconds: 20
      api-call-attempt-timeout-seconds: 10
      max-image-size-bytes: 5242880
      object-prefix: profiles
      meeting-object-prefix: meetings
      max-pending-uploads-per-user: 3
      cleanup-batch-size: 100
      cleanup-fixed-delay-milliseconds: 3600000
      cleanup-scheduler-enabled: false
  auth:
    rejoin-block-hmac:
      secret: Z2F0aGVyLXRlc3QtcmVqb2luLWJsb2NrLWhtYWMtc2VjcmV0LTIwMjYtMDctMjk=
      key-version: 1
    social-account-encryption:
      key: Z2F0aGVyLXRlc3Qtc29jaWFsLWFjY291bnQta2V5ISE=
      key-version: 1
    refresh-cookie:
      name: gather_refresh_token
      secure: false
      same-site: Lax
      path: /api/v1/auth
      max-age-seconds: 1209600
  cors:
    allowed-origins:
      - https://gathernow.kr
      - http://localhost:5173
      - https://dev.gathernow.kr
  email:
    mode: log

# 테스트 전용 더미 시크릿(운영 값 아님). Base64 디코딩 시 64바이트.
jwt:
  secret: XZWyFEbfHyT37TkUd6Z63CN9wJbT8vlWdmQSzoIZqqGOnAj4ezamA4BO/tChr4bmeE0bbSExFfD8lN/BLitbuQ==
  access-token-validity-minutes: 30

# 테스트 전용 더미 값(운영 값 아님). KakaoProperties가 기동 시점에 검증하므로 값이 없으면 컨텍스트가 뜨지 않는다.
kakao:
  rest-api-key: test-kakao-rest-api-key
  client-secret: test-kakao-client-secret
  signup-token-expiration-seconds: 900
  admin:
    enabled: false
  redirect-uris:
    - http://localhost:5173/login/kakao/callback
    - https://dev.gathernow.kr/login/kakao/callback
    - https://gathernow.kr/login/kakao/callback
