server:
  forward-headers-strategy: framework

spring:
  application:
    name: gather
  profiles:
    active: local
  config:
    import: optional:application-secret.yml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 이메일 발송 방식. log = 서버 로그로만 인증코드 출력(기본), smtp = 실제 발송.
# smtp 모드는 spring.mail.username/password 필요 (로컬: application-secret.yml, 운영: 환경변수).
gather:
  aws:
    s3:
      region: ${GATHER_AWS_REGION:ap-northeast-2}
      bucket: ${GATHER_AWS_S3_BUCKET:gather-local-profile-images}
      public-base-url: ${GATHER_AWS_S3_PUBLIC_BASE_URL:https://gather-local-profile-images.s3.ap-northeast-2.amazonaws.com}
      presigned-url-expiration-seconds: ${GATHER_AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
      api-call-timeout-seconds: ${GATHER_AWS_S3_API_CALL_TIMEOUT_SECONDS:20}
      api-call-attempt-timeout-seconds: ${GATHER_AWS_S3_API_CALL_ATTEMPT_TIMEOUT_SECONDS:10}
      max-image-size-bytes: ${GATHER_AWS_S3_MAX_IMAGE_SIZE_BYTES:5242880}
      object-prefix: ${GATHER_AWS_S3_OBJECT_PREFIX:profiles}
      max-pending-uploads-per-user: ${GATHER_AWS_S3_MAX_PENDING_UPLOADS_PER_USER:3}
      cleanup-batch-size: ${GATHER_AWS_S3_CLEANUP_BATCH_SIZE:100}
      cleanup-fixed-delay-milliseconds: ${GATHER_AWS_S3_CLEANUP_FIXED_DELAY_MILLISECONDS:3600000}
      cleanup-scheduler-enabled: ${GATHER_AWS_S3_CLEANUP_SCHEDULER_ENABLED:true}
      meeting-object-prefix: ${GATHER_AWS_S3_MEETING_OBJECT_PREFIX:meetings}
  auth:
    withdrawal:
      scheduler-enabled: ${GATHER_WITHDRAWAL_SCHEDULER_ENABLED:true}
    refresh-cookie:
      name: gather_refresh_token
      secure: ${GATHER_REFRESH_COOKIE_SECURE:false}
      same-site: ${GATHER_REFRESH_COOKIE_SAME_SITE:Lax}
      path: /api/v1/auth
      max-age-seconds: 1209600
  cors:
    allowed-origins:
      - https://gathernow.kr
      - http://localhost:5173
      - https://dev.gathernow.kr
  email:
    mode: log

volunteer-api:
  base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService

# 비밀값(rest-api-key/client-secret/signup-token-secret)은 여기 두지 않는다.
# 로컬은 application-secret.yml, 운영은 /etc/gather/gather.env 환경변수로 주입한다.
# redirect-uris는 카카오 콘솔 등록값과 문자열까지 정확히 같아야 한다(불일치 시 KOE006).
kakao:
  redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:5173/login/kakao/callback,https://dev.gathernow.kr/login/kakao/callback,https://gathernow.kr/login/kakao/callback}
  signup-token-expiration-seconds: ${KAKAO_SIGNUP_TOKEN_EXPIRATION_SECONDS:900}
