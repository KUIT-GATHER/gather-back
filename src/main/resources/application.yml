server:
  forward-headers-strategy: framework

notification:
  volunteer-schedule:
    scheduler-enabled: ${NOTIFICATION_VOLUNTEER_SCHEDULE_SCHEDULER_ENABLED:true}
    cron: ${NOTIFICATION_VOLUNTEER_SCHEDULE_CRON:0 0 9 * * *}

  bookmarked-meeting-deadline:
    scheduler-enabled: ${NOTIFICATION_BOOKMARKED_MEETING_DEADLINE_SCHEDULER_ENABLED:true}
    cron: ${NOTIFICATION_BOOKMARKED_MEETING_DEADLINE_CRON:0 20 9 * * *}

spring:
  application:
    name: gather
  profiles:
    active: local
  config:
    import: optional:application-secret.yml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 이메일 발송 방식. log = 서버 로그로만 인증코드 출력(기본), smtp = 실제 발송.
# smtp 모드는 spring.mail.username/password 필요 (로컬: application-secret.yml, 운영: 환경변수).
gather:
  scheduling:
    enabled: ${GATHER_SCHEDULING_ENABLED:true}
  kakao:
    unlink-resume:
      enabled: ${KAKAO_UNLINK_RESUME_ENABLED:false}
      task-ids: ${KAKAO_UNLINK_RESUME_TASK_IDS:}
      actor: ${KAKAO_UNLINK_RESUME_ACTOR:}
      reason: ${KAKAO_UNLINK_RESUME_REASON:}
  aws:
    s3:
      region: ${GATHER_AWS_REGION:ap-northeast-2}
      bucket: ${GATHER_AWS_S3_BUCKET:gather-local-profile-images}
      public-base-url: ${GATHER_AWS_S3_PUBLIC_BASE_URL:https://gather-local-profile-images.s3.ap-northeast-2.amazonaws.com}
      presigned-url-expiration-seconds: ${GATHER_AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
      api-call-timeout-seconds: ${GATHER_AWS_S3_API_CALL_TIMEOUT_SECONDS:20}
      api-call-attempt-timeout-seconds: ${GATHER_AWS_S3_API_CALL_ATTEMPT_TIMEOUT_SECONDS:10}
      max-image-size-bytes: ${GATHER_AWS_S3_MAX_IMAGE_SIZE_BYTES:5242880}
      object-prefix: ${GATHER_AWS_S3_OBJECT_PREFIX:profiles}
      max-pending-uploads-per-user: ${GATHER_AWS_S3_MAX_PENDING_UPLOADS_PER_USER:3}
      cleanup-batch-size: ${GATHER_AWS_S3_CLEANUP_BATCH_SIZE:100}
      cleanup-fixed-delay-milliseconds: ${GATHER_AWS_S3_CLEANUP_FIXED_DELAY_MILLISECONDS:3600000}
      cleanup-scheduler-enabled: ${GATHER_AWS_S3_CLEANUP_SCHEDULER_ENABLED:true}
      meeting-object-prefix: ${GATHER_AWS_S3_MEETING_OBJECT_PREFIX:meetings}
  auth:
    refresh-cookie:
      name: gather_refresh_token
      secure: ${GATHER_REFRESH_COOKIE_SECURE:false}
      same-site: ${GATHER_REFRESH_COOKIE_SAME_SITE:Lax}
      path: /api/v1/auth
      max-age-seconds: 1209600
  cors:
    allowed-origins:
      - https://gathernow.kr
      - http://localhost:5173
      - https://dev.gathernow.kr
  email:
    mode: log
  recommendation:
    category-weight: ${GATHER_RECOMMENDATION_CATEGORY_WEIGHT:0.7}
    deadline-weight: ${GATHER_RECOMMENDATION_DEADLINE_WEIGHT:0.3}
    deadline-window-days: ${GATHER_RECOMMENDATION_DEADLINE_WINDOW_DAYS:30}

volunteer-api:
  base-url: https://apis.data.go.kr/1741000/volunteerPartcptnService

# 비밀값(rest-api-key/client-secret)은 여기 두지 않는다.
# 로컬은 application-secret.yml, 운영은 /etc/gather/gather.env 환경변수로 주입한다.
# redirect-uris는 카카오 콘솔 등록값과 문자열까지 정확히 같아야 한다(불일치 시 KOE006).
kakao:
  redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:5173/login/kakao/callback,https://dev.gathernow.kr/login/kakao/callback,https://gathernow.kr/login/kakao/callback}
  signup-token-expiration-seconds: ${KAKAO_SIGNUP_TOKEN_EXPIRATION_SECONDS:900}
  admin:
    enabled: ${KAKAO_ADMIN_ENABLED:false}
    key: ${KAKAO_ADMIN_KEY:}
    api-base-url: ${KAKAO_ADMIN_API_BASE_URL:https://kapi.kakao.com}
    connect-timeout: ${KAKAO_ADMIN_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_ADMIN_READ_TIMEOUT:5s}
    unlink-worker:
      enabled: ${KAKAO_UNLINK_WORKER_ENABLED:false}
      poll-interval: ${KAKAO_UNLINK_WORKER_POLL_INTERVAL:30s}
      batch-size: ${KAKAO_UNLINK_WORKER_BATCH_SIZE:10}
      lease-duration: ${KAKAO_UNLINK_WORKER_LEASE_DURATION:120s}
      maximum-attempts: ${KAKAO_UNLINK_WORKER_MAXIMUM_ATTEMPTS:12}
      base-backoff: ${KAKAO_UNLINK_WORKER_BASE_BACKOFF:1m}
      maximum-backoff: ${KAKAO_UNLINK_WORKER_MAXIMUM_BACKOFF:6h}
      worker-identifier: ${KAKAO_UNLINK_WORKER_IDENTIFIER:${HOSTNAME:local}}
