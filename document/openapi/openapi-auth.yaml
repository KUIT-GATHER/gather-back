openapi: 3.0.3

info:
  title: Gather Auth API
  description: |
    Gather 서비스 인증 및 회원가입 관련 API 명세입니다.

    프론트 연동 참고사항:
    - `signup`, `login`, `logout`, `reissue`는 인증 행위 API이므로 동사형 경로를 사용합니다.
    - `regions`, `categories` 조회 API는 auth 도메인 소유는 아니지만 회원가입 화면에서 필요하므로 함께 명세에 포함했습니다.
    - 회원가입 요청에는 관심 카테고리 enum 값 배열인 `interestCategories`를 전달합니다. 값은 `PostingCategory`(ENVIRONMENT, EDUCATION, CULTURE, COMMUNITY, WELFARE, OVERSEAS) 중 중복 없이 1개 이상이며, 정의되지 않은 값은 400(`VALIDATION_ERROR`)입니다.
    - `GET /api/v1/categories`는 아직 기존 16종 분류(`id`/`code`/`name`)를 반환합니다. 6종 enum 전환은 별도 작업으로 진행 중이므로, 전환 완료 전까지 회원가입 카테고리 선택지는 프론트에서 6종 enum 기준으로 처리합니다.
    - Refresh Token은 응답 body가 아니라 `gather_refresh_token` HttpOnly 쿠키로 전달합니다.
    - 재발급과 로그아웃은 Access Token 없이 Refresh Token 쿠키만으로 요청합니다.
    - 로그아웃은 같은 Refresh Token 쿠키로 여러 번 요청해도 성공 응답을 반환합니다.
    - 휴대폰 인증은 Gather가 5분 유효한 인증문구를 만들고, 사용자가 OCTOMO 대표번호로 직접 문자를 보낸 뒤 confirm API로 확인하는 번호 점유 인증입니다. 인증 완료 결과는 30분 안에 해당 `verificationId`와 전화번호를 함께 제출한 일반·카카오 회원가입에서 한 번만 소비할 수 있습니다.
    - offset 없는 이메일 인증 시각(`expiresAt`, `resendAvailableAt`, `verifiedAt`)은 UTC 기준입니다. 휴대폰 인증 `expiresAt`은 UTC offset(`Z`)을 포함합니다.
    - 카카오 로그인은 `POST /api/v1/auth/kakao/login`에 `{authorizationCode, redirectUri}`를 전달합니다. `redirectUri`는 서버 허용 목록과 문자열까지 정확히 일치해야 합니다. 응답은 200이며 `signupStatus`로 기존 회원(`LOGIN_COMPLETED`)과 신규 회원(`ADDITIONAL_INFO_REQUIRED`)을 구분합니다. `ADDITIONAL_INFO_REQUIRED`는 에러가 아닙니다.
    - 신규 카카오 회원은 `POST /api/v1/auth/kakao/signup`에 추가정보를 제출하며, 로그인 응답으로 받은 가입용 임시 토큰을 `Authorization`이 아니라 `X-Signup-Token` 헤더로 전달합니다. 카카오 가입은 이메일·비밀번호를 받지 않습니다.
    - `/kakao/login` 실패 중 400(인가 코드 무효·재사용·redirectUri 불일치), 500(카카오 장애), 503(카카오 요청 제한)은 코드값으로 분기하지 말고 모두 "카카오 로그인 다시 시작"으로 처리합니다. 단 403(정지·탈퇴 처리 중·탈퇴)과 409(재가입 제한·소셜 연결 해제)는 재시작하지 않고 계정 상태를 안내합니다.
  version: 1.0.0

servers:
  - url: /
    description: Relative server URL

tags:
  - name: Auth
    description: 인증, 회원가입, 토큰 관련 API
  - name: Auth - Kakao
    description: 카카오 로그인 및 카카오 회원가입 API
  - name: Signup Support
    description: 회원가입 보조 조회 API

paths:
  /api/v1/auth/email-verifications:
    post:
      tags:
        - Auth
      summary: 이메일 인증 코드 발송
      description: 회원가입에 사용할 이메일로 인증 코드를 발송합니다.
      operationId: sendEmailVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationSendRequest'
            example:
              email: test@example.com
      responses:
        '200':
          description: 이메일 인증 코드 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationSendApiResponse'
              example:
                success: true
                data:
                  email: test@example.com
                  expiresAt: '2026-06-28T03:10:00'
                  resendAvailableAt: '2026-06-28T03:03:00'
                  message: 인증 코드가 발송되었습니다.
                error: null
        '400':
          description: 요청 값 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: 요청 값이 올바르지 않습니다.
        '409':
          description: 이미 사용 중인 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: DUPLICATE_EMAIL
                  message: 이미 사용 중인 이메일입니다.
        '429':
          description: 재발송 쿨다운(3분) 이내 재요청 또는 당일 발송 한도(5회) 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                resendTooSoon:
                  summary: 재발송 쿨다운 이내 재요청
                  value:
                    success: false
                    data: null
                    error:
                      code: EMAIL_RESEND_TOO_SOON
                      message: 인증 코드를 방금 발송했습니다. 잠시 후 다시 시도해주세요.
                sendLimitExceeded:
                  summary: 당일 발송 한도 초과
                  value:
                    success: false
                    data: null
                    error:
                      code: EMAIL_SEND_LIMIT_EXCEEDED
                      message: 하루 이메일 인증 발송 횟수를 초과했습니다. 내일 다시 시도해주세요.
        '500':
          description: 이메일 발송 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: EMAIL_SEND_FAILED
                  message: 이메일 발송에 실패했습니다.

  /api/v1/auth/email-verifications/confirm:
    post:
      tags:
        - Auth
      summary: 이메일 인증 코드 확인
      description: 사용자가 입력한 이메일 인증 코드가 유효한지 확인합니다.
      operationId: confirmEmailVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
            example:
              email: test@example.com
              code: '123456'
      responses:
        '200':
          description: 이메일 인증 코드 확인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationConfirmApiResponse'
              example:
                success: true
                data:
                  email: test@example.com
                  verified: true
                  verifiedAt: '2026-06-28T03:05:00'
                error: null
        '400':
          description: 요청 값 검증 실패 또는 인증 코드 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                validationError:
                  summary: 요청 값 검증 실패
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: 요청 값이 올바르지 않습니다.
                invalidVerificationCode:
                  summary: 인증 코드 불일치
                  value:
                    success: false
                    data: null
                    error:
                      code: INVALID_VERIFICATION_CODE
                      message: 인증 코드가 올바르지 않습니다.
                expiredVerificationCode:
                  summary: 인증 코드 만료
                  value:
                    success: false
                    data: null
                    error:
                      code: EXPIRED_VERIFICATION_CODE
                      message: 인증 코드가 만료되었습니다.
        '404':
          description: 이메일 인증 요청 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_NOT_FOUND
                  message: 이메일 인증 요청을 찾을 수 없습니다.
        '429':
          description: 인증 코드 입력 시도 횟수(5회) 초과. 코드를 재발송해야 합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_ATTEMPTS_EXCEEDED
                  message: 인증 코드 입력 가능 횟수를 초과했습니다. 코드를 다시 발송해주세요.

  /api/v1/auth/phone-verifications:
    post:
      tags:
        - Auth
      summary: 휴대폰 문자 인증 시작
      description: 010 휴대폰 번호를 정규화하고 5분 유효한 인증 세션을 만듭니다. 같은 번호의 연속 시작 요청은 60초 동안 제한합니다. 모바일은 응답의 receiverNumber와 messageText로 sms URI를 구성합니다.
      operationId: startPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationStartRequest'
            example:
              phoneNumber: '01012345678'
      responses:
        '201':
          description: 휴대폰 인증 세션 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationStartApiResponse'
              example:
                success: true
                data:
                  verificationId: 5c5d5db1-4187-43d0-8580-672307994878
                  receiverNumber: '16663538'
                  messageText: |-
                    [Gather]
                    전화번호 인증을 위한 문자입니다.
                    본 문자를 전송하시면 전화번호 인증이 자동으로 완료됩니다.

                    인증코드: [GATHER-7F2K9Q8M4P]
                  expiresAt: '2026-08-09T06:50:00Z'
                error: null
        '400':
          description: 010으로 시작하는 11자리 휴대폰 번호가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: 요청 값이 올바르지 않습니다.
        '429':
          description: 같은 번호의 인증 시작 요청 간격 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_RATE_LIMITED
                  message: 휴대폰 인증 요청이 많습니다. 잠시 후 다시 시도해주세요.

  /api/v1/auth/phone-verifications/{verificationId}/qr-code:
    post:
      tags:
        - Auth
      summary: PC용 휴대폰 인증 QR 발급
      description: request body를 받지 않고 서버에 저장된 인증문구로 OCTOMO SMS QR data URL을 발급합니다. 같은 인증 세션은 10초 간격, 최대 3회로 제한합니다.
      operationId: createPhoneVerificationQrCode
      parameters:
        - $ref: '#/components/parameters/PhoneVerificationId'
      responses:
        '201':
          description: QR 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationQrCodeApiResponse'
              example:
                success: true
                data:
                  qrCode: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
                error: null
        '400':
          description: verificationId 형식 오류 또는 인증 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                validationError:
                  summary: verificationId 형식 오류
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: 요청 값이 올바르지 않습니다.
                phoneVerificationExpired:
                  summary: 인증 세션 만료
                  value:
                    success: false
                    data: null
                    error:
                      code: PHONE_VERIFICATION_EXPIRED
                      message: 휴대폰 인증 요청이 만료되었습니다.
        '404':
          description: 인증 세션 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_NOT_FOUND
                  message: 휴대폰 인증 요청을 찾을 수 없습니다.
        '429':
          description: QR 발급 횟수·간격 제한 또는 OCTOMO 요청 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_RATE_LIMITED
                  message: 휴대폰 인증 요청이 많습니다. 잠시 후 다시 시도해주세요.
        '503':
          description: OCTOMO 설정·네트워크·서비스 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_PROVIDER_UNAVAILABLE
                  message: 휴대폰 인증 서비스를 일시적으로 사용할 수 없습니다.

  /api/v1/auth/phone-verifications/{verificationId}/confirm:
    post:
      tags:
        - Auth
      summary: 휴대폰 문자 인증 확인
      description: request body를 받지 않고 서버 저장 전화번호와 인증문구를 OCTOMO에서 확인합니다. 문자가 아직 없으면 오류가 아닌 PENDING을 반환합니다. 같은 인증 세션은 3초 간격, 최대 30회로 제한합니다.
      operationId: confirmPhoneVerification
      parameters:
        - $ref: '#/components/parameters/PhoneVerificationId'
      responses:
        '200':
          description: 문자 수신 대기 또는 휴대폰 인증 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationConfirmApiResponse'
              examples:
                pending:
                  value:
                    success: true
                    data:
                      status: PENDING
                    error: null
                verified:
                  value:
                    success: true
                    data:
                      status: VERIFIED
                    error: null
        '400':
          description: verificationId 형식 오류 또는 인증 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                validationError:
                  summary: verificationId 형식 오류
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: 요청 값이 올바르지 않습니다.
                phoneVerificationExpired:
                  summary: 인증 세션 만료
                  value:
                    success: false
                    data: null
                    error:
                      code: PHONE_VERIFICATION_EXPIRED
                      message: 휴대폰 인증 요청이 만료되었습니다.
        '404':
          description: 인증 세션 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_NOT_FOUND
                  message: 휴대폰 인증 요청을 찾을 수 없습니다.
        '409':
          description: 이미 가입된 전화번호 또는 탈퇴 후 재가입 제한 중인 전화번호
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                duplicatePhoneNumber:
                  summary: 이미 가입된 전화번호
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_PHONE_NUMBER
                      message: 이미 사용 중인 전화번호입니다.
                accountRejoinBlocked:
                  summary: 탈퇴 후 재가입 제한 중인 전화번호
                  value:
                    success: false
                    data: null
                    error:
                      code: ACCOUNT_REJOIN_BLOCKED
                      message: 탈퇴 후 7일 동안 재가입할 수 없습니다.
        '429':
          description: 확인 횟수·간격 제한 또는 OCTOMO 요청 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_RATE_LIMITED
                  message: 휴대폰 인증 요청이 많습니다. 잠시 후 다시 시도해주세요.
        '503':
          description: OCTOMO 설정·네트워크·서비스 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: PHONE_VERIFICATION_PROVIDER_UNAVAILABLE
                  message: 휴대폰 인증 서비스를 일시적으로 사용할 수 없습니다.

  /api/v1/auth/phone-numbers/availability:
    post:
      tags:
        - Auth
      summary: 전화번호 중복 확인
      description: 기존 클라이언트 호환을 위해 유지하는 API입니다. 신규 회원가입에서는 휴대폰 인증 API를 사용합니다. 이미 가입에 사용됐거나 탈퇴 후 재가입 제한 중이면 available은 false입니다.
      operationId: checkPhoneNumberAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberAvailabilityRequest'
            example:
              phoneNumber: '01012345678'
      responses:
        '200':
          description: 전화번호 중복 확인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberAvailabilityApiResponse'
              examples:
                available:
                  summary: 사용 가능한 전화번호
                  value:
                    success: true
                    data:
                      phoneNumber: '01012345678'
                      available: true
                    error: null
                unavailable:
                  summary: 이미 사용 중이거나 재가입 제한 중인 전화번호
                  value:
                    success: true
                    data:
                      phoneNumber: '01012345678'
                      available: false
                    error: null
        '400':
          description: 요청 값 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: 요청 값이 올바르지 않습니다.

  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: 요청 전화번호와 일치하는 30분 이내 미소비 휴대폰 인증이 필요합니다. 기본 정보, 계정 정보, 프로필 정보, 활동 지역, 관심 카테고리, 약관 동의를 한 번에 제출하여 회원가입과 자동 로그인을 완료합니다. Access Token은 응답 body로, Refresh Token은 HttpOnly 쿠키로 발급됩니다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: 홍길동
              birthDate: '2002-03-15'
              gender: MALE
              phoneNumber: '01012345678'
              phoneVerificationId: 5c5d5db1-4187-43d0-8580-672307994878
              email: test@example.com
              password: password123!
              passwordConfirm: password123!
              nickname: 길동
              introduction: 함께 봉사하고 싶습니다.
              activityRegionId: 123
              interestCategories:
                - WELFARE
                - EDUCATION
              serviceTermsAgreed: true
              privacyPolicyAgreed: true
              marketingAgreed: false
      responses:
        '201':
          description: 회원가입 및 자동 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키. Domain은 설정하지 않으며 Path는 `/api/v1/auth`입니다.
              schema:
                type: string
              example: gather_refresh_token=refresh-token-value; Path=/api/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupApiResponse'
              example:
                success: true
                data:
                  userId: 1
                  email: test@example.com
                  name: 홍길동
                  nickname: 길동
                  accessToken: access-token-value
                  tokenType: Bearer
                error: null
        '400':
          description: 요청 값 검증 실패 또는 비즈니스 규칙 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                validationError:
                  summary: 단일 필드 검증 실패
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: 요청 값이 올바르지 않습니다.
                passwordMismatch:
                  summary: 비밀번호 확인 불일치
                  value:
                    success: false
                    data: null
                    error:
                      code: PASSWORD_MISMATCH
                      message: 비밀번호가 일치하지 않습니다.
                emailNotVerified:
                  summary: 이메일 인증 미완료
                  value:
                    success: false
                    data: null
                    error:
                      code: EMAIL_NOT_VERIFIED
                      message: 이메일 인증이 완료되지 않았습니다.
                phoneVerificationRequired:
                  summary: 휴대폰 인증 없음·ID/전화번호 불일치·인증 만료·이미 소비됨
                  value:
                    success: false
                    data: null
                    error:
                      code: PHONE_VERIFICATION_REQUIRED
                      message: 휴대폰 인증이 필요합니다.
                requiredTermsNotAgreed:
                  summary: 필수 약관 미동의
                  value:
                    success: false
                    data: null
                    error:
                      code: REQUIRED_TERMS_NOT_AGREED
                      message: 필수 약관 동의가 필요합니다.
                invalidInterestCategoryCount:
                  summary: 관심 카테고리 개수 오류
                  value:
                    success: false
                    data: null
                    error:
                      code: INVALID_INTEREST_CATEGORY_COUNT
                      message: 관심 카테고리는 중복 없이 1개 이상 선택해야 합니다.
        '404':
          description: 활동 지역 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                regionNotFound:
                  summary: 활동 지역 없음
                  value:
                    success: false
                    data: null
                    error:
                      code: REGION_NOT_FOUND
                      message: 활동 지역을 찾을 수 없습니다.
        '409':
          description: 중복 데이터 존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                duplicateEmail:
                  summary: 이메일 중복
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_EMAIL
                      message: 이미 사용 중인 이메일입니다.
                duplicatePhoneNumber:
                  summary: 전화번호 중복
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_PHONE_NUMBER
                      message: 이미 사용 중인 전화번호입니다.
                duplicateNickname:
                  summary: 닉네임 중복
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_NICKNAME
                      message: 이미 사용 중인 닉네임입니다.
                accountRejoinBlocked:
                  summary: 탈퇴 후 7일 재가입 제한
                  value:
                    success: false
                    data: null
                    error:
                      code: ACCOUNT_REJOIN_BLOCKED
                      message: 탈퇴 후 7일 동안 재가입할 수 없습니다.

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일과 비밀번호를 검증한 뒤 Access Token은 응답 본문으로, Refresh Token은 HttpOnly 쿠키로 발급합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: test@example.com
              password: password123!
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키. Domain은 설정하지 않으며 Path는 `/api/v1/auth`입니다.
              schema:
                type: string
              example: gather_refresh_token=refresh-token-value; Path=/api/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenApiResponse'
              example:
                success: true
                data:
                  accessToken: access-token-value
                  tokenType: Bearer
                error: null
        '400':
          description: 요청 값 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: 요청 값이 올바르지 않습니다.
        '401':
          description: 로그인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: INVALID_LOGIN
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
        '403':
          description: 계정 상태로 인한 로그인 차단
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                suspendedUser:
                  summary: 이용 정지 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: SUSPENDED_USER
                      message: 이용 정지된 계정입니다.
                withdrawalPendingUser:
                  summary: 탈퇴 처리 중인 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWAL_PENDING_USER
                      message: 탈퇴 처리 중인 계정입니다.
                withdrawnUser:
                  summary: 탈퇴 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWN_USER
                      message: 탈퇴한 계정입니다.

  /api/v1/auth/reissue:
    post:
      tags:
        - Auth
      summary: 토큰 재발급
      description: Refresh Token 쿠키를 검증한 뒤 새로운 Access Token과 Refresh Token 쿠키를 발급합니다.
      operationId: reissueToken
      parameters:
        - name: gather_refresh_token
          in: cookie
          required: true
          description: 로그인 또는 직전 재발급에서 받은 HttpOnly Refresh Token 쿠키
          schema:
            type: string
      responses:
        '200':
          description: 토큰 재발급 성공
          headers:
            Set-Cookie:
              description: rotation으로 새로 발급되는 HttpOnly Refresh Token 쿠키
              schema:
                type: string
              example: gather_refresh_token=new-refresh-token-value; Path=/api/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenApiResponse'
              example:
                success: true
                data:
                  accessToken: new-access-token-value
                  tokenType: Bearer
                error: null
        '401':
          description: Refresh Token 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                invalidToken:
                  summary: 유효하지 않은 토큰
                  value:
                    success: false
                    data: null
                    error:
                      code: INVALID_TOKEN
                      message: 유효하지 않은 토큰입니다.
                expiredToken:
                  summary: 만료된 토큰
                  value:
                    success: false
                    data: null
                    error:
                      code: EXPIRED_TOKEN
                      message: 만료된 토큰입니다.
                revokedToken:
                  summary: 폐기된 토큰
                  value:
                    success: false
                    data: null
                    error:
                      code: REVOKED_TOKEN
                      message: 폐기된 토큰입니다.
        '403':
          description: 사용자 상태로 인한 재발급 차단
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                suspendedUser:
                  summary: 이용 정지 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: SUSPENDED_USER
                      message: 이용 정지된 계정입니다.
                withdrawalPendingUser:
                  summary: 탈퇴 처리 중인 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWAL_PENDING_USER
                      message: 탈퇴 처리 중인 계정입니다.
                withdrawnUser:
                  summary: 탈퇴 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWN_USER
                      message: 탈퇴한 계정입니다.

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: |
        Refresh Token 하나를 폐기합니다.

        Access Token 인증을 요구하지 않으며 Refresh Token 쿠키만으로 처리합니다.
        이는 Access Token이 만료된 상태에서도 사용자가 로그아웃할 수 있도록 하기 위함입니다.

        이미 폐기되었거나 만료된 Refresh Token도 서버에 기록이 존재하면 성공 응답을 반환합니다(멱등 처리).
      operationId: logout
      parameters:
        - name: gather_refresh_token
          in: cookie
          required: true
          description: 폐기할 HttpOnly Refresh Token 쿠키
          schema:
            type: string
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: Refresh Token 삭제 쿠키
              schema:
                type: string
              example: gather_refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutApiResponse'
              example:
                success: true
                data: null
                error: null
        '401':
          description: 유효하지 않은 Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: INVALID_TOKEN
                  message: 유효하지 않은 토큰입니다.

  /api/v1/auth/kakao/login:
    post:
      tags:
        - Auth - Kakao
      summary: 카카오 로그인
      description: |
        카카오 인가 코드를 검증한 뒤 기존 회원이면 로그인시키고, 신규 회원이면 가입용 임시 토큰을 발급합니다.
        두 경우 모두 HTTP 200이며 `signupStatus`로 구분합니다. `ADDITIONAL_INFO_REQUIRED`는 에러가 아닙니다.

        400(인가 코드 무효·재사용, redirectUri 불일치), 500(카카오 장애), 503(카카오 요청 제한)은 코드값으로 분기하지 말고 모두
        "카카오 로그인 다시 시작"으로 처리합니다. 403은 계정 상태를 안내하고, 409는 재가입 제한 또는 연결 해제 상태를 안내합니다.
      operationId: kakaoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
            example:
              authorizationCode: R0-abcdefghijklmnopqrstuvwxyz1234567890
              redirectUri: https://gathernow.kr/login/kakao/callback
      responses:
        '200':
          description: 카카오 인증 성공. 기존 회원은 로그인 완료, 신규 회원은 추가정보 입력 필요.
          headers:
            Set-Cookie:
              description: LOGIN_COMPLETED일 때만 발급되는 HttpOnly Refresh Token 쿠키
              schema:
                type: string
              example: gather_refresh_token=refresh-token-value; Path=/api/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoLoginApiResponse'
              examples:
                loginCompleted:
                  summary: 기존 카카오 회원 로그인 완료
                  value:
                    success: true
                    data:
                      signupStatus: LOGIN_COMPLETED
                      accessToken: access-token-value
                      tokenType: Bearer
                    error: null
                additionalInfoRequired:
                  summary: 신규 카카오 회원. 추가정보 입력 필요.
                  value:
                    success: true
                    data:
                      signupStatus: ADDITIONAL_INFO_REQUIRED
                      signupToken: signup-token-value
                      profile:
                        nickname: 동현
                    error: null
                additionalInfoRequiredNoNickname:
                  summary: 카카오 닉네임을 가져오지 못한 경우
                  value:
                    success: true
                    data:
                      signupStatus: ADDITIONAL_INFO_REQUIRED
                      signupToken: signup-token-value
                      profile:
                        nickname: null
                    error: null
        '400':
          description: 요청 값 검증 실패, 인가 코드 무효·재사용, 또는 허용되지 않은 redirectUri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: 요청 값이 올바르지 않습니다.
        '403':
          description: 기존 카카오 회원의 계정 상태로 인한 로그인 차단. 재시작이 아니라 계정 상태 안내가 필요합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                suspendedUser:
                  summary: 이용 정지 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: SUSPENDED_USER
                      message: 이용 정지된 계정입니다.
                withdrawalPendingUser:
                  summary: 탈퇴 처리 중인 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWAL_PENDING_USER
                      message: 탈퇴 처리 중인 계정입니다.
                withdrawnUser:
                  summary: 탈퇴 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: WITHDRAWN_USER
                      message: 탈퇴한 계정입니다.
        '409':
          description: 탈퇴 후 재가입 제한 또는 연결 해제된 소셜 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                accountRejoinBlocked:
                  summary: 탈퇴 후 7일 재가입 제한
                  value:
                    success: false
                    data: null
                    error:
                      code: ACCOUNT_REJOIN_BLOCKED
                      message: 탈퇴 후 7일 동안 재가입할 수 없습니다.
                socialAccountNotLinked:
                  summary: 연결 해제된 소셜 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: SOCIAL_ACCOUNT_NOT_LINKED
                      message: 연결 해제된 소셜 계정입니다.
        '500':
          description: 카카오 API 장애 또는 타임아웃
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: 서버 오류가 발생했습니다.
        '503':
          description: 카카오 API 요청 제한. 카카오 로그인을 다시 시작하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: KAKAO_API_UNAVAILABLE
                  message: 카카오 로그인 서비스를 일시적으로 사용할 수 없습니다.

  /api/v1/auth/kakao/signup:
    post:
      tags:
        - Auth - Kakao
      summary: 카카오 추가정보 가입
      description: |
        카카오 로그인에서 받은 일회성 opaque 가입 토큰과 추가정보로 회원가입을 완료하고 곧바로 로그인 토큰을 발급합니다.
        이메일과 비밀번호는 받지 않습니다. 요청의 phoneVerificationId와 전화번호가 일치하는 30분 이내 미소비 휴대폰 인증이 필요합니다.

        가입 토큰은 `Authorization`이 아니라 `X-Signup-Token` 헤더로 보냅니다.
        전화번호가 이미 가입에 사용된 경우 `DUPLICATE_PHONE_NUMBER`(409)로 실패합니다. 이는 기존 일반 계정과
        동일인이라는 뜻이므로, 입력 오류가 아니라 기존 계정 로그인 안내로 처리합니다.
      operationId: kakaoSignup
      parameters:
        - name: X-Signup-Token
          in: header
          required: true
          description: 카카오 로그인 응답으로 받은 일회성 opaque 가입 토큰
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoSignupRequest'
            example:
              name: 홍길동
              birthDate: '2002-03-15'
              gender: MALE
              phoneNumber: '01012345678'
              phoneVerificationId: 5c5d5db1-4187-43d0-8580-672307994878
              nickname: 길동
              introduction: 함께 봉사하고 싶습니다.
              activityRegionId: 123
              interestCategories:
                - WELFARE
                - EDUCATION
              serviceTermsAgreed: true
              privacyPolicyAgreed: true
              marketingAgreed: false
      responses:
        '201':
          description: 가입 및 자동 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키
              schema:
                type: string
              example: gather_refresh_token=refresh-token-value; Path=/api/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenApiResponse'
              example:
                success: true
                data:
                  accessToken: access-token-value
                  tokenType: Bearer
                error: null
        '400':
          description: 요청 값 검증 실패 또는 비즈니스 규칙 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                validationError:
                  summary: 단일 필드 검증 실패
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: 요청 값이 올바르지 않습니다.
                requiredTermsNotAgreed:
                  summary: 필수 약관 미동의
                  value:
                    success: false
                    data: null
                    error:
                      code: REQUIRED_TERMS_NOT_AGREED
                      message: 필수 약관 동의가 필요합니다.
                phoneVerificationRequired:
                  summary: 휴대폰 인증 없음·ID/전화번호 불일치·인증 만료·이미 소비됨
                  value:
                    success: false
                    data: null
                    error:
                      code: PHONE_VERIFICATION_REQUIRED
                      message: 휴대폰 인증이 필요합니다.
                invalidInterestCategoryCount:
                  summary: 관심 카테고리 개수 오류
                  value:
                    success: false
                    data: null
                    error:
                      code: INVALID_INTEREST_CATEGORY_COUNT
                      message: 관심 카테고리는 중복 없이 1개 이상 선택해야 합니다.
        '401':
          description: 가입용 토큰 오류. signupToken을 지우고 카카오 로그인부터 다시 시작하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                signupTokenExpired:
                  summary: 가입용 토큰 만료(15분 초과)
                  value:
                    success: false
                    data: null
                    error:
                      code: SIGNUP_TOKEN_EXPIRED
                      message: 가입 인증이 만료되었습니다. 카카오 로그인부터 다시 진행해주세요.
                signupTokenInvalid:
                  summary: 잘못된 형식·존재하지 않음·이미 소비 또는 취소됨·헤더 누락
                  value:
                    success: false
                    data: null
                    error:
                      code: SIGNUP_TOKEN_INVALID
                      message: 유효하지 않은 가입 인증입니다. 카카오 로그인부터 다시 진행해주세요.
        '404':
          description: 활동 지역 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                error:
                  code: REGION_NOT_FOUND
                  message: 활동 지역을 찾을 수 없습니다.
        '409':
          description: 중복 데이터 존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              examples:
                duplicatePhoneNumber:
                  summary: 이미 가입된 전화번호. 기존 계정 로그인 안내가 필요합니다.
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_PHONE_NUMBER
                      message: 이미 사용 중인 전화번호입니다.
                duplicateNickname:
                  summary: 닉네임 중복
                  value:
                    success: false
                    data: null
                    error:
                      code: DUPLICATE_NICKNAME
                      message: 이미 사용 중인 닉네임입니다.
                alreadyRegistered:
                  summary: 이미 가입된 카카오 계정(가입 토큰 재사용)
                  value:
                    success: false
                    data: null
                    error:
                      code: ALREADY_REGISTERED
                      message: 이미 가입된 계정입니다.
                accountRejoinBlocked:
                  summary: 탈퇴 후 7일 재가입 제한
                  value:
                    success: false
                    data: null
                    error:
                      code: ACCOUNT_REJOIN_BLOCKED
                      message: 탈퇴 후 7일 동안 재가입할 수 없습니다.
                socialAccountNotLinked:
                  summary: 연결 해제된 소셜 계정
                  value:
                    success: false
                    data: null
                    error:
                      code: SOCIAL_ACCOUNT_NOT_LINKED
                      message: 연결 해제된 소셜 계정입니다.

  /api/v1/regions:
    get:
      tags:
        - Signup Support
      summary: 활동 지역 목록 조회
      description: 회원가입 프로필 단계에서 선택 가능한 활동 지역 목록을 조회합니다. 인증이 필요 없습니다.
      operationId: getRegions
      responses:
        '200':
          description: 활동 지역 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListApiResponse'
              example:
                success: true
                data:
                  - id: 1
                    name: 서울
                    level: 1
                    code: '11'
                    parentId: null
                  - id: 2
                    name: 경기
                    level: 1
                    code: '41'
                    parentId: null
                error: null

  /api/v1/categories:
    get:
      tags:
        - Signup Support
      summary: 관심 카테고리 목록 조회
      description: 회원가입 프로필 단계에서 선택 가능한 관심 카테고리 목록을 조회합니다. 인증이 필요 없습니다.
      operationId: getCategories
      responses:
        '200':
          description: 관심 카테고리 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListApiResponse'
              example:
                success: true
                data:
                  - id: 1
                    code: '0100'
                    name: 생활편의
                  - id: 4
                    code: '0400'
                    name: 교육
                error: null

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PhoneVerificationId:
      name: verificationId
      in: path
      required: true
      description: 휴대폰 인증 세션 식별자
      schema:
        type: string
        format: uuid

  schemas:
    Gender:
      type: string
      description: 성별
      enum:
        - MALE
        - FEMALE
      example: MALE

    Role:
      type: string
      description: 사용자 권한. 회원가입 요청에서는 전달하지 않고 서버가 USER를 기본 저장합니다.
      enum:
        - USER
        - ADMIN
      example: USER

    UserStatus:
      type: string
      description: 사용자 계정 상태. 회원가입 요청에서는 전달하지 않고 서버가 ACTIVE를 기본 저장합니다.
      enum:
        - ACTIVE
        - SUSPENDED
        - WITHDRAWN
      example: ACTIVE

    PostingCategory:
      type: string
      description: 관심 카테고리 enum. 공고·모임·회원 관심 카테고리에서 공통으로 사용하는 6종 분류입니다.
      enum:
        - ENVIRONMENT
        - EDUCATION
        - CULTURE
        - COMMUNITY
        - WELFARE
        - OVERSEAS
      example: WELFARE

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 에러 코드
          example: VALIDATION_ERROR
        message:
          type: string
          description: 에러 메시지
          example: 요청 값이 올바르지 않습니다.

    ErrorApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/ApiError'

    EmailVerificationSendRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 인증 코드를 받을 이메일. 서버에서 앞뒤 공백 제거 및 소문자화합니다.
          example: test@example.com

    EmailVerificationSendData:
      type: object
      required:
        - email
        - expiresAt
        - resendAvailableAt
        - message
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        expiresAt:
          type: string
          description: 인증 코드 만료 시각(UTC, offset 없는 ISO-8601)
          example: '2026-06-28T03:10:00'
        resendAvailableAt:
          type: string
          description: 재발송 가능 시각(UTC, offset 없는 ISO-8601). 이 시각 전에는 재발송이 거부됩니다.
          example: '2026-06-28T03:03:00'
        message:
          type: string
          example: 인증 코드가 발송되었습니다.

    EmailVerificationSendApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/EmailVerificationSendData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    EmailVerificationConfirmRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 인증을 진행한 이메일
          example: test@example.com
        code:
          type: string
          description: 사용자가 입력한 인증 코드
          example: '123456'

    EmailVerificationConfirmData:
      type: object
      required:
        - email
        - verified
        - verifiedAt
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        verified:
          type: boolean
          example: true
        verifiedAt:
          type: string
          description: 이메일 인증 완료 시각(UTC, offset 없는 ISO-8601)
          example: '2026-06-28T03:05:00'

    EmailVerificationConfirmApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/EmailVerificationConfirmData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    PhoneVerificationStartRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          maxLength: 20
          description: 인증할 전화번호. 하이픈과 공백은 서버에서 제거하며 정규화 결과는 010으로 시작하는 11자리 숫자여야 합니다.
          example: '01012345678'

    PhoneVerificationStartData:
      type: object
      required:
        - verificationId
        - receiverNumber
        - messageText
        - expiresAt
      properties:
        verificationId:
          type: string
          format: uuid
        receiverNumber:
          type: string
          example: '16663538'
        messageText:
          type: string
          description: 줄바꿈을 포함해 모바일 SMS body에 그대로 사용할 전체 문자 본문
          example: |-
            [Gather]
            전화번호 인증을 위한 문자입니다.
            본 문자를 전송하시면 전화번호 인증이 자동으로 완료됩니다.

            인증코드: [GATHER-7F2K9Q8M4P]
        expiresAt:
          type: string
          format: date-time
          description: 인증 세션 만료 시각(UTC)
          example: '2026-08-09T06:50:00Z'

    PhoneVerificationStartApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PhoneVerificationStartData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    PhoneVerificationQrCodeData:
      type: object
      required:
        - qrCode
      properties:
        qrCode:
          type: string
          description: img src에 바로 사용할 수 있는 PNG data URL
          example: data:image/png;base64,iVBORw0KGgo...

    PhoneVerificationQrCodeApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PhoneVerificationQrCodeData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    PhoneVerificationConfirmData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
            - VERIFIED

    PhoneVerificationConfirmApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PhoneVerificationConfirmData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    PhoneNumberAvailabilityRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          maxLength: 20
          pattern: '^[0-9]+$'
          description: 중복 확인할 전화번호. 하이픈과 공백은 서버에서 제거 후 정규화합니다.
          example: '01012345678'

    PhoneNumberAvailabilityData:
      type: object
      required:
        - phoneNumber
        - available
      properties:
        phoneNumber:
          type: string
          example: '01012345678'
        available:
          type: boolean
          description: true면 가입 가능, false면 이미 사용 중이거나 탈퇴 후 재가입 제한 중인 번호
          example: true

    PhoneNumberAvailabilityApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PhoneNumberAvailabilityData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    SignupRequest:
      type: object
      required:
        - name
        - birthDate
        - gender
        - phoneNumber
        - phoneVerificationId
        - email
        - password
        - passwordConfirm
        - nickname
        - activityRegionId
        - interestCategories
        - serviceTermsAgreed
        - privacyPolicyAgreed
        - marketingAgreed
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^(?:[가-힣]{2,10}|[A-Za-z]{2,20})$'
          description: 이름. 완성형 한글 2~10자 또는 영문 2~20자만 허용하며, 혼합·공백·숫자·특수문자는 허용하지 않습니다.
          example: 홍길동
        birthDate:
          type: string
          format: date
          description: 생년월일. yyyy-MM-dd 형식이며 미래 날짜는 허용하지 않습니다.
          example: '2002-03-15'
        gender:
          $ref: '#/components/schemas/Gender'
        phoneNumber:
          type: string
          maxLength: 20
          description: 전화번호. 하이픈과 공백을 제거한 결과가 010으로 시작하는 11자리 숫자여야 합니다. +82는 자동 변환하지 않습니다.
          example: '01012345678'
        phoneVerificationId:
          type: string
          format: uuid
          description: 이 전화번호를 VERIFIED로 만든 인증 세션 ID. 가입 성공 트랜잭션에서 한 번만 소비됩니다.
          example: 5c5d5db1-4187-43d0-8580-672307994878
        email:
          type: string
          format: email
          maxLength: 255
          description: 이메일. 이메일 인증 완료가 필요합니다. 서버에서 앞뒤 공백 제거 및 소문자화합니다.
          example: test@example.com
        password:
          type: string
          minLength: 6
          maxLength: 12
          description: 비밀번호. 6자 이상 12자 이하입니다.
          example: password123!
        passwordConfirm:
          type: string
          minLength: 6
          maxLength: 12
          description: 비밀번호 확인
          example: password123!
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^(?:[가-힣]{2,10}|[A-Za-z]{2,20})$'
          description: 닉네임. 완성형 한글 2~10자 또는 영문 2~20자만 허용하며, 혼합·공백·숫자·특수문자는 허용하지 않습니다.
          example: 길동
        introduction:
          type: string
          maxLength: 50
          nullable: true
          description: 소개글. 최대 50자입니다.
          example: 함께 봉사하고 싶습니다.
        activityRegionId:
          type: integer
          format: int64
          description: 활동 지역 ID. 시도(level 1) 또는 시군구(level 2) 단위 활동 지역 1개입니다. 향후 공고/모임 검색의 기본 지역 필터 초기값으로 사용합니다.
          example: 123
        interestCategories:
          type: array
          minItems: 1
          uniqueItems: true
          description: 관심 카테고리 목록. 중복 없이 1개 이상입니다.
          items:
            $ref: '#/components/schemas/PostingCategory'
          example:
            - WELFARE
            - EDUCATION
        serviceTermsAgreed:
          type: boolean
          description: 서비스 이용약관 동의 여부. true 필수입니다.
          example: true
        privacyPolicyAgreed:
          type: boolean
          description: 개인정보 처리방침 동의 여부. true 필수입니다.
          example: true
        marketingAgreed:
          type: boolean
          description: 맞춤형 봉사/이벤트 알림 수신 동의 여부. 선택 동의입니다.
          example: false

    SignupData:
      type: object
      required:
        - userId
        - email
        - name
        - nickname
        - accessToken
        - tokenType
      properties:
        userId:
          type: integer
          format: int64
          description: 생성된 사용자 ID
          example: 1
        email:
          type: string
          format: email
          description: 가입 이메일
          example: test@example.com
        name:
          type: string
          description: 사용자 이름
          example: 홍길동
        nickname:
          type: string
          description: 사용자 닉네임
          example: 길동
        accessToken:
          type: string
          description: API 인증에 사용할 Access Token
          example: access-token-value
        tokenType:
          type: string
          description: 토큰 타입
          example: Bearer

    SignupApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SignupData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    KakaoLoginRequest:
      type: object
      required:
        - authorizationCode
        - redirectUri
      properties:
        authorizationCode:
          type: string
          description: 카카오 콜백으로 전달받은 인가 코드. 한 번 사용하면 재사용할 수 없습니다.
          example: R0-abcdefghijklmnopqrstuvwxyz1234567890
        redirectUri:
          type: string
          description: 인가 요청에 사용한 Redirect URI. 서버 허용 목록과 문자열까지 정확히 일치해야 합니다.
          example: https://gathernow.kr/login/kakao/callback

    KakaoProfile:
      type: object
      description: 추가정보 화면의 닉네임 초깃값 용도. ADDITIONAL_INFO_REQUIRED일 때만 내려갑니다.
      properties:
        nickname:
          type: string
          nullable: true
          description: 카카오 닉네임. 없으면 null입니다.
          example: 동현

    KakaoLoginData:
      type: object
      description: |
        signupStatus에 따라 채워지는 필드가 다릅니다. 해당 상태에 없는 필드는 응답에서 생략됩니다.
        LOGIN_COMPLETED이면 accessToken·tokenType이, ADDITIONAL_INFO_REQUIRED이면 signupToken·profile이 내려갑니다.
      required:
        - signupStatus
      properties:
        signupStatus:
          type: string
          enum:
            - LOGIN_COMPLETED
            - ADDITIONAL_INFO_REQUIRED
          description: 로그인 결과 상태. 둘 다 정상 200 응답입니다.
          example: ADDITIONAL_INFO_REQUIRED
        accessToken:
          type: string
          nullable: true
          description: Gather Access Token. LOGIN_COMPLETED일 때만 내려갑니다.
          example: access-token-value
        tokenType:
          type: string
          nullable: true
          description: 토큰 타입. LOGIN_COMPLETED일 때만 내려갑니다.
          example: Bearer
        signupToken:
          type: string
          nullable: true
          description: 일회성 opaque 가입 토큰. ADDITIONAL_INFO_REQUIRED일 때만 내려갑니다. X-Signup-Token 헤더로 재전송합니다.
          example: signup-token-value
        profile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/KakaoProfile'

    KakaoLoginApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/KakaoLoginData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    KakaoSignupRequest:
      type: object
      required:
        - name
        - birthDate
        - gender
        - phoneNumber
        - phoneVerificationId
        - nickname
        - activityRegionId
        - interestCategories
        - serviceTermsAgreed
        - privacyPolicyAgreed
        - marketingAgreed
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^(?:[가-힣]{2,10}|[A-Za-z]{2,20})$'
          description: 이름. 완성형 한글 2~10자 또는 영문 2~20자만 허용하며, 혼합·공백·숫자·특수문자는 허용하지 않습니다.
          example: 홍길동
        birthDate:
          type: string
          format: date
          description: 생년월일. yyyy-MM-dd 형식이며 미래 날짜는 허용하지 않습니다.
          example: '2002-03-15'
        gender:
          $ref: '#/components/schemas/Gender'
        phoneNumber:
          type: string
          maxLength: 20
          description: 전화번호. 하이픈과 공백을 제거한 결과가 010으로 시작하는 11자리 숫자여야 합니다. +82는 자동 변환하지 않습니다.
          example: '01012345678'
        phoneVerificationId:
          type: string
          format: uuid
          description: 이 전화번호를 VERIFIED로 만든 인증 세션 ID. 가입 성공 트랜잭션에서 한 번만 소비됩니다.
          example: 5c5d5db1-4187-43d0-8580-672307994878
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^(?:[가-힣]{2,10}|[A-Za-z]{2,20})$'
          description: 닉네임. 완성형 한글 2~10자 또는 영문 2~20자만 허용합니다. 카카오 닉네임을 초깃값으로 채운 뒤 사용자가 수정할 수 있습니다.
          example: 길동
        introduction:
          type: string
          maxLength: 50
          nullable: true
          description: 소개글. 최대 50자입니다.
          example: 함께 봉사하고 싶습니다.
        activityRegionId:
          type: integer
          format: int64
          description: 활동 지역 ID. 시도(level 1) 또는 시군구(level 2) 단위 1개입니다.
          example: 123
        interestCategories:
          type: array
          minItems: 1
          uniqueItems: true
          description: 관심 카테고리 목록. 중복 없이 1개 이상입니다.
          items:
            $ref: '#/components/schemas/PostingCategory'
          example:
            - WELFARE
            - EDUCATION
        serviceTermsAgreed:
          type: boolean
          description: 서비스 이용약관 동의 여부. true 필수입니다.
          example: true
        privacyPolicyAgreed:
          type: boolean
          description: 개인정보 처리방침 동의 여부. true 필수입니다.
          example: true
        marketingAgreed:
          type: boolean
          description: 맞춤형 봉사/이벤트 알림 수신 동의 여부. 선택 동의입니다.
          example: false

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 가입한 이메일
          example: test@example.com
        password:
          type: string
          description: 비밀번호
          example: password123!

    TokenData:
      type: object
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
          description: API 인증에 사용할 Access Token
          example: access-token-value
        tokenType:
          type: string
          description: 토큰 타입
          example: Bearer

    TokenApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TokenData'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    LogoutApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
          example: null
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    Region:
      type: object
      required:
        - id
        - name
        - level
        - code
      properties:
        id:
          type: integer
          format: int64
          description: 지역 ID. 회원가입의 activityRegionId에 사용합니다.
          example: 1
        name:
          type: string
          description: 지역 표시명
          example: 서울
        level:
          type: integer
          description: 행정구역 계층. 1=시도, 2=시, 3=구, 4=동
          example: 1
        code:
          type: string
          description: 지역 식별 코드. 단일 시도는 1365 행정구역 코드(sidoCd)와 매핑되고, 광역권(경상/전라/충청)은 서비스 내부 코드가 사용될 수 있습니다. 프론트 고정 순서 정렬에 활용할 수 있습니다.
          example: '11'
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 상위 지역 ID. 최상위(시도)인 경우 null입니다.
          example: null

    RegionListApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null

    Category:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          format: int64
          description: 카테고리 ID. 기존 16종 분류의 DB 참조용 식별자입니다.
          example: 1
        code:
          type: string
          description: 1365 기준 봉사분야 숫자 문자열 코드입니다. 현재 seed 기준 값은 0100 생활편의, 0200 주거환경, 0300 상담·멘토링, 0400 교육, 0500 보건·의료, 0600 농어촌 봉사, 0700 문화·체육·예술·관광, 0800 환경·생태계보호, 0900 사무행정, 1000 지역안전·보호, 1100 인권·공익, 1200 재난·재해, 1300 국제협력·해외봉사, 1500 기타, 1700 자원봉사 기본교육, 1900 온라인자원봉사입니다.
          example: '0100'
        name:
          type: string
          description: 카테고리 표시명
          example: 생활편의

    CategoryListApiResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
          example: null
